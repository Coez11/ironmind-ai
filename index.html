<!DOCTYPE html>
<html>
<head>
    <title>ZOOMIEFITNESS</title>

</head>

<input id="goal" placeholder="What's your goal?">

    <option value="0">Voice 1</option>

    <option value="2">Voice 3</option>

    <option value="friendly">😊 Friendly Coach</option>
    <option value="military">🪖 Military Coach</option>
    <option value="beast">🔥 Beast Mode</option>
</select>

<br><br>

<button onclick="coach()">Motivate Me</button>

<button onclick="beastMode()">🔥 Beast Mode</button>

<h2 id="powerLevel">🔥 Power Level: 0</h2>

<img id="exerciseImage"
     width="350"
     style="border-radius:15px;">

<p id="output"></p>

<script src="script.js"></script>

</body>
</html>
